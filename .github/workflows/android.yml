name: FREE MAX Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download game source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Pygame source
        run: |
          python -m pip install pygame
          python -c "import pygame; print(pygame.version.ver)"
          test -f main.py

      - name: Finish
        run: echo "FREE MAX source check completed"
      
